<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enchant Simulator</title>
    <link rel="stylesheet" href="src/css/style.css">
</head>
<body>
    <div id="game-container">
        <h1>Enchant Simulator</h1>

        <!-- 상단 정보 -->
        <div class="info-bar">
            <div class="resource">
                <span>골드:</span>
                <span id="gold-display">0</span>
            </div>
            <div class="resource">
                <span>강화석:</span>
                <span id="stone-display">0</span>
            </div>
            <div class="resource">
                <span>스테이지:</span>
                <span id="stage-display">1</span>
            </div>
        </div>

        <!-- 몹 영역 -->
        <div id="mob-area">
            <div id="mob-name">Mob</div>
            <div class="hp-container">
                <div id="hp-bar" class="hp-bar"></div>
            </div>
            <div id="mob-hp">0 / 0</div>
        </div>

        <!-- 장착 무기 정보 -->
        <div id="equipped-weapon-info">
            <div class="equipped-label">장착 무기</div>
            <div id="equipped-weapon-details">무기 없음</div>
        </div>

        <!-- 버튼 영역 -->
        <div class="button-area">
            <button id="inventory-btn">인벤토리</button>
            <button id="enhance-btn">강화</button>
        </div>
    </div>

    <!-- 인벤토리 모달 -->
    <div id="inventory-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>인벤토리</h2>
                <button class="close-btn" id="close-inventory">&times;</button>
            </div>
            <div class="modal-body">
                <div id="inventory-list"></div>
            </div>
        </div>
    </div>

    <!-- 강화 모달 -->
    <div id="enhance-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>무기 강화</h2>
                <button class="close-btn" id="close-enhance">&times;</button>
            </div>
            <div class="modal-body">
                <div id="enhance-weapon-select">
                    <p class="info-text">강화할 무기를 선택하세요</p>
                    <div id="enhance-weapon-list"></div>
                </div>

                <div id="enhance-panel" style="display: none;">
                    <div class="enhance-info">
                        <h3 id="enhance-weapon-name"></h3>
                        <div class="enhance-stats">
                            <div>현재 공격력: <span id="enhance-current-attack"></span></div>
                            <div>현재 강화: <span id="enhance-current-level"></span></div>
                            <div>내구도: <span id="enhance-current-durability"></span></div>
                        </div>
                    </div>

                    <div class="enhance-controls">
                        <div class="enhance-row">
                            <label>강화석 사용:</label>
                            <input type="range" id="stone-slider" min="0" max="0" value="0">
                            <span id="stone-count">0</span>
                        </div>

                        <div class="enhance-row">
                            <label>성공 확률:</label>
                            <span id="success-rate" class="highlight">0%</span>
                        </div>

                        <div class="enhance-row">
                            <label>필요 골드:</label>
                            <span id="enhance-cost" class="highlight">0G</span>
                        </div>

                        <div class="enhance-warning">
                            <p>⚠️ 강화 실패 시 내구도가 감소합니다</p>
                            <p>⚠️ 내구도가 0이 되면 무기가 파괴됩니다</p>
                        </div>

                        <button id="enhance-execute-btn" class="enhance-btn-large">강화하기</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 상점 모달 -->
    <div id="shop-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>🏪 상점</h2>
                <button class="close-btn" id="close-shop">&times;</button>
            </div>
            <div class="modal-body">
                <!-- 탭 버튼 -->
                <div class="shop-tabs">
                    <button class="shop-tab active" id="buy-tab">구매</button>
                    <button class="shop-tab" id="sell-tab">판매</button>
                </div>

                <!-- 구매 탭 -->
                <div id="buy-panel" class="shop-panel">
                    <p class="info-text">무기를 구매하세요</p>
                    <div id="shop-buy-list"></div>
                </div>

                <!-- 판매 탭 -->
                <div id="sell-panel" class="shop-panel" style="display: none;">
                    <p class="info-text">무기를 판매하세요 (판매가: 가치의 58%)</p>
                    <div id="shop-sell-list"></div>
                </div>

                <!-- 스킵 버튼 -->
                <button id="shop-skip-btn" class="shop-skip-btn">상점 나가기</button>
            </div>
        </div>
    </div>

    <!-- JavaScript 파일들 -->
    <script src="src/js/config.js"></script>
    <script src="src/js/Weapon.js"></script>
    <script src="src/js/Mob.js"></script>
    <script src="src/js/GameManager.js"></script>
    <script src="src/js/UI.js"></script>
    <script src="src/js/main.js"></script>
</body>
</html>
